name: Required CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  site-integrity:
    name: Site integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run validator tests
        run: python -m unittest discover -s tests -v

      - name: Validate site
        run: python scripts/validate_site.py .
